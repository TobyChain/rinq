name: Rinq
options:
  bundleIdPrefix: com.tobychain.rinq
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES

targets:
  RinqApp:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tobychain.rinq.app
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Rinq
        CODE_SIGN_ENTITLEMENTS: Rinq.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: RinqWidget
        embed: true

  RinqWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: iOSWidget
        excludes:
          - "Info.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tobychain.rinq.app.widget
        INFOPLIST_KEY_CFBundleDisplayName: Rinq
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: iOSWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Rinq.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"

  RinqWatchApp:
    type: application
    platform: watchOS
    sources:
      - path: Watch
        excludes:
          - "Info.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tobychain.rinq.app.watch
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Watch/Info.plist
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Rinq
        TARGETED_DEVICE_FAMILY: 4
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
    dependencies:
      - target: RinqWatchWidget
        embed: true

  RinqWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: WatchWidget
        excludes:
          - "Info.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tobychain.rinq.app.watch.widget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: WatchWidget/Info.plist
        TARGETED_DEVICE_FAMILY: 4
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
